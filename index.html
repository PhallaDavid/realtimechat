<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Niyey Knea</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var legacy = localStorage.getItem('Xync-theme');
          var t = localStorage.getItem('niyey-knea-theme') || legacy;
          if (legacy && !localStorage.getItem('niyey-knea-theme')) {
            localStorage.setItem('niyey-knea-theme', legacy);
          }
          var dark =
            t === 'dark' ||
            (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
